<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ciudad Inteligente</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main id="welcome" class="welcome disable-selection" aria-labelledby="site-title">
      <div class="welcome-card">
        <p class="eyebrow">Proyecto científico · Matemática aplicada</p>
        <h1 id="site-title">Ciudad Inteligente</h1>
        <p class="subtitle">MATRICES, DETERMINANTES Y ANÁLISIS DE DATOS</p>
        <div class="academic-data">
          <p>Análisis matemático - 1° año.<br><strong>Profesor: Ing. Santiago M. Rodriguez.</strong></p>
          <p><strong>Alumnos:</strong> Juliani Diego Hernán, Falcone Valentín</p>
        </div>
        <a id="visit-city" class="visit-button" href="./hovers.html">Visitar la Ciudad Inteligente</a>
      </div>
    </main>
    <script>
      (function () {
        window.citySceneEnabled = true;
        var scripts = [
          'https://cdnjs.cloudflare.com/ajax/libs/three.js/89/three.min.js',
          'https://cdnjs.cloudflare.com/ajax/libs/gsap/1.20.3/TweenMax.min.js',
          './script.js'
        ];
        var index = 0;

        function loadNext() {
          if (index >= scripts.length) {
            return;
          }
          var script = document.createElement('script');
          script.src = scripts[index++];
          script.onload = loadNext;
          script.onerror = function () {
            console.warn('No se pudo cargar el módulo de la ciudad 3D.');
          };
          document.body.appendChild(script);
        }

        loadNext();
      }());
    </script>
  </body>
</html>
